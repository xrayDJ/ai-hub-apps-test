name: Sunflower Android

on:
  push:
    paths:
      - 'sunflower_android/**'
      - '.github/workflows/sunflower-android.yml'
  pull_request:
    paths:
      - 'sunflower_android/**'
      - '.github/workflows/sunflower-android.yml'
  workflow_dispatch:

concurrency:
  group: sunflower-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sunflower_android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: sunflower-debug-apk
          path: sunflower_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
