name: Build GenieX Chat Android APK

on:
  push:
    branches: [claude/geniex-chat-android-apk-393aux]
    paths:
      - 'geniex_chat_android/**'
      - '.github/workflows/build-geniex-chat-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: geniex_chat_android
    steps:
      - uses: actions/checkout@v4

      # Versions from geniex_chat_android/scripts/versions.env
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;27.3.13750724"

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: geniex-chat-android-debug-apk
          path: geniex_chat_android/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
